channels:                # 追蹤的頻道（handle），每次執行抓取最新上傳
  - "@sensebar"
  - "@yuiraymond"
  - "@papayaclass"
  - "@Teacher_Kong"

filters:
  min_duration_seconds: 120   # 排除 Shorts
  relevance_language: zh-Hant
  max_results_per_keyword: 25
  initial_days: 180           # 首次執行往回抓的天數

gemini:
  model: gemini-3.5-flash
  batch_size: 30
  pause_seconds: 7   # 批次間隔秒數，避開免費層每分鐘請求上限
