keywords:
  - ChatGPT
  - ChatGPT 應用
  - AI 自動化
  - Claude code
  - Claude cowork
  - Claude 應用
  - Gemini 教學
  - Codex 教學
  - n8n 教學
  - n8n 應用
  - AI 繪圖 教學
  - AI 辦公 應用
  - AI 影片生成 教學
  - NotebookLM 教學
  - AI agent 教學
  - LINE Bot AI
  - google apps script ai教學
  - AI 助理


categories:
  - 入門觀念
  - 工具教學
  - 辦公應用
  - 自動化工作流
  - AI 影像與影片生成
  - 程式開發

channels:                # 追蹤的頻道（handle），每次執行抓取最新上傳
  - "@sensebar"
  - "@yuiraymond"
  - "@papayaclass"
  - "@Teacher_Kong"

filters:
  min_duration_seconds: 120   # 排除 Shorts
  relevance_language: zh-Hant
  max_results_per_keyword: 25
  initial_days: 180           # 首次執行往回抓的天數

gemini:
  model: gemini-3.5-flash-lite
  batch_size: 30
  pause_seconds: 7   # 批次間隔秒數，避開免費層每分鐘請求上限

transcript:
  enabled: true
  max_chars: 3000
  batch_size: 5    # 有字幕時每批影片數（字幕佔 token，批次必須調小）

article:
  max_chars: 3000    # 文章正文送進 AI 的字數上限

sites:                     # 自動訂閱的網站（只支援有 RSS 或 sitemap 的站）
  - name: 遠見
    feed: https://www.gvm.com.tw/rss
  - name: 科技島
    feed: https://www.technice.com.tw/feed
  - name: 數位時代
    sitemap: https://www.bnext.com.tw/feed/sitemap.xml
    sitemap_filter: /article/

site_filter:
  max_per_site: 20         # 每站每次最多取幾篇（先關鍵字篩選再取）
  match:                   # 標題或網址命中任一詞才收；之後仍由 AI 判斷是否為教學內容
    - AI
    - ChatGPT
    - Claude
    - Gemini
    - Copilot
    - LLM
    - agent
    - n8n
    - 生成式
    - 自動化
    - 提示詞
    - 機器學習
